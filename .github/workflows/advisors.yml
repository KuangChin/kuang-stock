# 抓投顧 YouTube 自動字幕並推到雲端（Vercel 本身抓不到字幕）。
# 實測 2026-11-04：YouTube 對 GitHub 的機器連 RSS 都回 404，所以這支只保留手動觸發備用；
# 正式的字幕推送在本機排程跑 npm run advisors-push（見 README）。
# 需要 repo secrets：APP_URL、CRON_SECRET（與 auto-cycle 相同）。
name: advisors-transcripts
on:
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev
      - name: Install yt-dlp
        run: python3 -m pip install --user -q yt-dlp && ~/.local/bin/yt-dlp --version
      - name: Fetch subtitles and push
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YTDLP: /home/runner/.local/bin/yt-dlp
        run: node scripts/advisors-push.mjs
