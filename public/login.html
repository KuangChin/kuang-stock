<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · kuang-stock</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  .login { max-width: 360px; margin: 18vh auto; padding: 28px; background: var(--panel, #fff); border: 1px solid var(--border, #e3e6ea); border-radius: 12px; }
  .login h1 { font-size: 20px; margin: 0 0 6px; }
  .login p { color: var(--muted, #667); margin: 0 0 18px; font-size: 14px; }
  .login input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px; border: 1px solid var(--border, #cfd4da); border-radius: 8px; margin-bottom: 12px; }
  .login button { width: 100%; padding: 10px; font-size: 16px; border: 0; border-radius: 8px; background: #2a78d6; color: #fff; cursor: pointer; }
  .login .err { color: #c0392b; font-size: 14px; min-height: 20px; margin-top: 10px; }
</style>
</head>
<body>
<form class="login" id="f">
  <h1>kuang-stock</h1>
  <p>輸入密碼進入模擬操盤</p>
  <input type="password" id="pw" placeholder="密碼" autocomplete="current-password" autofocus>
  <button type="submit">登入</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (r.ok) location.href = "/"; else err.textContent = (await r.json().catch(() => ({}))).error || "登入失敗";
});
</script>
</body>
</html>
